# Render Blueprint — deploy the Caddiebot webhook as a free web service.
# In Render: New + → Blueprint → pick this repo. Render reads this file.
# You'll be asked to fill the two LINE secrets (they are NOT stored in git).
services:
  - type: web
    name: caddiebot
    runtime: node
    plan: free
    region: singapore # closest to Thailand; change if you like
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false # prompted in the Render dashboard
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      # Live game state is persisted here. WITHOUT this, the free instance's
      # ~15 min idle sleep wipes any in-progress round — which looks exactly
      # like "the game timed out" between every hole.
      - key: DATABASE_URL
        fromDatabase:
          name: caddiebot-db
          property: connectionString
      # Self-ping /health every 10 min so the free instance stays awake during
      # a round (a group goes quiet far longer than 15 min between holes).
      - key: SELF_URL
        value: https://caddiebot.onrender.com

databases:
  - name: caddiebot-db
    plan: free
    databaseName: caddiebot
